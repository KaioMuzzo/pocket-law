<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Law</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
  <main class="max-w-md mx-auto">
    <header class="flex items-center gap-2 mb-4">
      <h1 class="text-2xl font-bold shrink-0">Pocket Law</h1>
      <select id="lesson-filter" class="min-w-0 flex-1 p-1.5 text-sm rounded-lg border border-slate-300 bg-white"></select>
      <select id="topic-filter" class="min-w-0 flex-1 p-1.5 text-sm rounded-lg border border-slate-300 bg-white"></select>
    </header>
    <p id="score" class="text-sm text-slate-600 mb-2">Acertos: 0 de 0</p>
    <section class="bg-white rounded-xl p-4 shadow">
      <p id="topic" class="text-xs text-slate-500 mb-2"></p>
      <p id="question" class="text-lg">Carregando...</p>
      <div id="options" class="mt-4 flex flex-col gap-2"></div>
      <button id="next" class="hidden mt-4 w-full p-3 rounded-lg bg-slate-800 text-white">Próxima</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
